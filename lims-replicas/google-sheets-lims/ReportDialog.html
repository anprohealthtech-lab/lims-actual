<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { padding: 16px; margin: 0; background: #f5f5f5; }
    h3 { color: #4285f4; margin-top: 0; border-bottom: 2px solid #4285f4; padding-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    input:focus { outline: none; border-color: #4285f4; }
    .btn { padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; }
    .btn-primary { background: #4285f4; color: white; }
    .btn:hover { opacity: 0.9; }
    .success { background: #d4edda; color: #155724; padding: 16px; border-radius: 8px; margin-top: 16px; }
    .success a { color: #155724; font-weight: bold; }
    .error { background: #f8d7da; color: #721c24; padding: 16px; border-radius: 8px; margin-top: 16px; }
    .loading { text-align: center; padding: 30px; display: none; }
    .loading-spinner { font-size: 24px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .info { background: #e8f0fe; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; color: #1967d2; }
  </style>
</head>
<body>
  <h3>📄 Generate Report</h3>

  <div class="info">
    ℹ️ Reports can only be generated for orders with all results verified.
  </div>

  <div class="form-group">
    <label>Order Number</label>
    <input type="text" id="orderNumber" placeholder="e.g., ORD-250625-001" onkeypress="if(event.key==='Enter')generateReport()">
  </div>

  <button class="btn btn-primary" onclick="generateReport()">📄 Generate PDF Report</button>

  <div class="loading" id="loading">
    <span class="loading-spinner">⏳</span><br>
    Generating report...<br>
    <small>This may take a few seconds</small>
  </div>

  <div id="result"></div>

  <script>
    function generateReport() {
      const orderNumber = document.getElementById('orderNumber').value.trim();

      if (!orderNumber) {
        alert('Please enter an order number');
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').innerHTML = '';

      google.script.run
        .withSuccessHandler(function(response) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('result').innerHTML = `
            <div class="success">
              <strong>✅ Report Generated!</strong><br><br>
              📄 <a href="${response.pdfUrl}" target="_blank">Open PDF Report</a><br><br>
              📝 <a href="${response.docUrl}" target="_blank">Open Editable Doc</a>
            </div>
          `;
        })
        .withFailureHandler(function(error) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('result').innerHTML = `
            <div class="error">❌ ${error.message}</div>
          `;
        })
        .generateReport(orderNumber);
    }
  </script>
</body>
</html>
